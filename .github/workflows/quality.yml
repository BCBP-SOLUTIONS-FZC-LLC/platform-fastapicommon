# Reusable workflow — called by validate.yml's "Quality" job. Its job id ("quality")
# combines with the calling chain to produce the "Validate / Quality / quality" required
# status check.
# Runs: checkout → uv sync (dev group + grpc extra, from uv.lock) → pip check → format
# check → ruff → mypy → pip-audit
name: Quality Check

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --extra grpc

      - name: Verify dependency resolution
        run: uv pip check

      - name: Format check (ruff format + black --check)
        run: |
          uv run ruff format --check src tests examples
          uv run black --check src tests examples

      - name: Lint (ruff)
        run: uv run ruff check src tests examples

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Vulnerability check (pip-audit)
        run: uv run pip-audit
