# Pre-merge CHANGELOG check.
# Fails if a PR changes library code, the package metadata or its locked
# dependencies, the build backend or the image without also updating
# CHANGELOG.md. Consumers read the CHANGELOG to decide how to upgrade
# (breaking changes, wire-format or metric changes, raised dependency floors,
# …), so every consumer-visible change needs an entry. Catches missing entries
# before the release workflow's CHANGELOG gate, reducing friction at tag time.
# Ported from platform-pgcommon-py (and the Go repos).
#
# Not a required check. Dependabot PRs are exempt: this repo keeps Dependabot
# on, and its
# lock/action/base-image bumps are batched into the next release's CHANGELOG
# entry by the maintainer instead.
name: Changelog check

"on":
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'build-constraints.txt'
      - 'Dockerfile'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: CHANGELOG updated in this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated in this PR — OK."
          else
            echo "::error file=CHANGELOG.md,title=CHANGELOG not updated::This PR changes src/, pyproject.toml, uv.lock, build-constraints.txt or the Dockerfile but does not update CHANGELOG.md. Add an entry under the [Unreleased] section before merging."
            exit 1
          fi
