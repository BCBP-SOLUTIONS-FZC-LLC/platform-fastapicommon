# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-fastapicommon
name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  coverage:
    name: Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --extra grpc

      # Scoped to unit + integration: tests/e2e builds and runs the real Docker image,
      # which belongs to this workflow's "Smoke tests" job, not a per-Python-version matrix.
      - name: Test with coverage (>=90% required, enforced by pyproject.toml)
        run: uv run pytest tests/unit tests/integration

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        run: uv build

      - name: Verify build artifacts
        run: ls dist/*.whl dist/*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fastapicommon-dist
          path: dist/
          if-no-files-found: error

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Booting buildx pulls the moby/buildkit image from Docker Hub, which occasionally
      # times out on shared GitHub-hosted runner IPs ("context deadline exceeded") — a
      # known transient flake, not a config problem. Retry once with the same action
      # before failing the job.
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: platform-fastapicommon-example:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Booting buildx pulls the moby/buildkit image from Docker Hub, which occasionally
      # times out on shared GitHub-hosted runner IPs ("context deadline exceeded") — a
      # known transient flake, not a config problem. Retry once with the same action
      # before failing the job.
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      # Rebuilds against the GHA cache populated by "Build image (cache)" — fast, and
      # keeps this job self-contained (no cross-job image tarball transfer needed).
      - name: Build image (load, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: platform-fastapicommon-example:ci
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-fastapicommon-example:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Booting buildx pulls the moby/buildkit image from Docker Hub, which occasionally
      # times out on shared GitHub-hosted runner IPs ("context deadline exceeded") — a
      # known transient flake, not a config problem. Retry once with the same action
      # before failing the job.
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Build image (load, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: platform-fastapicommon-example:ci
          cache-from: type=gha

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --extra grpc

      # Reuses the image built above (E2E_IMAGE_TAG) instead of tests/e2e building its
      # own — avoids a redundant docker build in this job.
      - name: Run e2e tests against the built image
        env:
          E2E_IMAGE_TAG: platform-fastapicommon-example:ci
        run: uv run pytest tests/e2e -v -m e2e --no-cov

  docker:
    name: Docker image (example service)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/bcbp-solutions-fzc-llc/platform-fastapicommon
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # Booting buildx pulls the moby/buildkit image from Docker Hub, which occasionally
      # times out on shared GitHub-hosted runner IPs ("context deadline exceeded") — a
      # known transient flake, not a config problem. Retry once with the same action
      # before failing the job.
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: BUILD_VERSION=dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  interop:
    name: Cross-language compatibility
    needs: build
    uses: BCBP-SOLUTIONS-FZC-LLC/platform-interop-tests/.github/workflows/interop.yml@main
    with:
      # This repo's own PR/branch ref; the other five default to their main branch (see
      # platform-interop-tests/README.md for why).
      platform_fastapicommon_ref: ${{ github.head_ref || github.ref_name }}
    secrets:
      gh_private_token: ${{ secrets.GO_PRIVATE_TOKEN }}

  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [validate, build-image, lint-dockerfile, trivy-scan, smoke-tests]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post summary comment
        uses: actions/github-script@v9
        with:
          script: |
            const results = {
              'Validate (Quality + Test)': '${{ needs.validate.result }}',
              'Build image (cache)': '${{ needs.build-image.result }}',
              'Lint Dockerfile': '${{ needs.lint-dockerfile.result }}',
              'Trivy CVE scan': '${{ needs.trivy-scan.result }}',
              'Smoke tests': '${{ needs.smoke-tests.result }}',
            };
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(results)
              .map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`)
              .join('\n');
            const body = [
              '### CI summary',
              '',
              '| Check | Result |',
              '|---|---|',
              rows,
            ].join('\n');

            const marker = '<!-- pr-summary-bot -->';
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
