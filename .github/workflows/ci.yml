# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-fastapicommon
#
# Same structure, jobs and gates as platform-gincommon's ci.yml, translated to
# the Python tooling (as platform-pgcommon-py and platform-eventcommon did).
# Parallel flow (every job below needs `changes`, which decides docs-only):
#
#   validate-test ──────┬──► interop (cross-language compatibility)
#   build-image ────────┤──► trivy ──────┐
#                       │   smoke ───────┤──► pr-summary (PR events only)
#                       └────────────────┤──► push       (push events only, needs quality too)
#   validate-quality ───────────────────┘
#   api-compat (informational)
#
# The library itself is published by git tag to PyPI (release.yml); the image
# built here is the example FastAPI service (examples/fastapi_service) — a
# runnable demonstration, not the library.
#
# validate-test runs the full suite + coverage gate (the required check
# "Validate / Test / test"), plus the Python 3.11/3.13/3.14 matrix and the
# lowest-direct-dependencies job, and gates trivy/smoke/interop/push
# (correctness). validate-quality ("Validate / Quality / quality") gates push
# only (style + lint + types + docs + vuln + supply chain + packaging).
# build-image lints the Dockerfile (Hadolint + .dockerignore check) as its
# first steps, before the expensive build — a lint failure never starts the
# build, and there's no separate lint-dockerfile job to pay a job-minute for.
# pr-summary posts a status table on pull_request events.
#
# Docs-only changes (any *.md, docs/architecture/*.mmd — but nothing under
# docs/observability/, which the observability-standard checks cover) skip the
# expensive jobs, but the workflow itself always runs: the `changes` job
# (detect-changes.sh) decides, and every job behind a required check is
# skipped by `if:` instead of the whole workflow being filtered out by
# `paths-ignore` — a workflow that never starts never reports its required
# checks, which deadlocks docs-only PRs. A skipped job reports success to
# branch protection. The reusable validate-* workflows get `skip` as an input
# and skip their inner jobs themselves: skipping the CALLER job would report
# only "Validate / Test", never the required "Validate / Test / test".
# docs.yml checks docs changes.
#
# Every image build in this file (build-image, trivy, smoke, push) uses the
# same build args (BUILD_VERSION below, SOURCE_DATE_EPOCH from `changes`, also
# set as BuildKit's SOURCE_DATE_EPOCH with rewrite-timestamp on the loaded and
# pushed outputs), and push publishes only an image whose content fingerprint
# matches the one trivy and smoke judged (image-fingerprint.sh, before the push
# and on the pushed digest before signing) — the same gate as release.yml.
#
# Third-party actions are pinned by commit SHA (`# vX.Y.Z`); keep the comment
# in step when bumping.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# On a PR, a newer push supersedes the older run (cancelled). On main every
# push gets its own group (keyed by the commit): GitHub cancels a *pending*
# run in a group when a newer one queues even with cancel-in-progress false,
# and a cancelled code commit followed by a docs-only one would never have
# its image built, pushed and signed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/platform-fastapicommon
  CI_IMAGE: platform-fastapicommon-ci-test
  BUILDKIT_PROGRESS: plain
  # The one BUILD_VERSION of every image build here (the pushed image's).
  BUILD_VERSION: dev-${{ github.sha }}

jobs:
  # ── docs-only detection + the shared SOURCE_DATE_EPOCH ───────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      source_date_epoch: ${{ steps.detect.outputs.SOURCE_DATE_EPOCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Detect docs-only change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/detect-changes.sh

  # ── runs in parallel with validate-quality + build-image ─────────────────
  # Not skipped here (see the header): the reusable workflow skips its jobs.
  validate-test:
    name: Validate / Test
    needs: changes
    uses: ./.github/workflows/validate-test.yml
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
    secrets:
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}

  # ── runs in parallel with validate-test + build-image ────────────────────
  validate-quality:
    name: Validate / Quality
    needs: changes
    uses: ./.github/workflows/validate-quality.yml
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
      require_gincommon_parity: ${{ github.event_name != 'pull_request' }}
    secrets:
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}

  # ── informational: public-API changes since the last release.
  # release.yml runs the same check as a blocking gate for the tag.
  api-compat:
    name: API compatibility
    runs-on: ubuntu-latest
    needs: changes
    # PRs and pushes to main (informational on both; the same check is
    # blocking in release.yml, where the version is known).
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # The uv the Dockerfile pins, so CI and the image resolve and build alike.
          version: '0.13.1'
          python-version: '3.12'

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --locked

      # Warns (does not fail) on breaking changes: the next version is
      # decided at release time, where the same check is blocking.
      - name: API changes since the last release (griffe)
        run: make api-compat

  # ── runs in parallel with validate-test + validate-quality ───────────────
  # Lints the Dockerfile as its first steps — a hadolint failure exits before
  # the expensive build ever starts, no separate job/job-minute needed.
  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      # Cache targets (SOURCE_DATE_EPOCH comes from the changes job).
      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/set-build-cache-targets.sh

      # Log in so registry cache reads (and writes on non-fork runs) are authenticated.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Booting buildx pulls the moby/buildkit image from Docker Hub, which
      # occasionally times out on shared GitHub-hosted runner IPs ("context
      # deadline exceeded") — a known transient flake, not a config problem.
      # Retry once with the same action before failing the job.
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build and write all layers to GHA + registry cache (no local load needed here).
      - name: Build image → cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.changes.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          # This cache job only feeds downstream trivy/smoke, which load amd64 images.
          platforms: linux/amd64
          push: false
          load: false
          # Pull fresh base image on push/manual runs; skip on PRs for speed.
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            SOURCE_DATE_EPOCH=${{ needs.changes.outputs.source_date_epoch }}

  # ── gates on build-image, runs in parallel with smoke ─────────────────────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [changes, validate-test, build-image]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      # type=docker is `load: true` plus rewrite-timestamp, as the pushed image.
      - name: Load image from cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.changes.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            SOURCE_DATE_EPOCH=${{ needs.changes.outputs.source_date_epoch }}

      # Content fingerprint of the image this job judges; push must match it.
      - name: Record image fingerprint
        id: fp
        run: bash .github/scripts/image-fingerprint.sh "${CI_IMAGE}"

      # Trivy DB cache: trivy-action caches its cache-dir itself (actions/cache,
      # key cache-trivy-<YYYY-MM-DD>, restore-keys cache-trivy-), so there is
      # no separate cache step.

      # Table format: human-readable in CI logs; fails on CRITICAL/HIGH/UNKNOWN.
      # Scans the OS layer and the installed Python packages (site-packages).
      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          scanners: vuln
          cache-dir: /tmp/trivy-cache

      # SARIF format: uploads to GitHub Security tab.
      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full component inventory for compliance / audit.
      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── gates on validate-test + build-image, runs in parallel with trivy ─────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [changes, validate-test, build-image]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.changes.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            SOURCE_DATE_EPOCH=${{ needs.changes.outputs.source_date_epoch }}

      # Content fingerprint of the image this job judges; push must match it.
      - name: Record image fingerprint
        id: fp
        run: bash .github/scripts/image-fingerprint.sh "${CI_IMAGE}"

      - name: Smoke tests
        env:
          IMAGE: ${{ env.CI_IMAGE }}
        run: bash .github/scripts/smoke-tests.sh

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # The uv the Dockerfile pins, so CI and the image resolve and build alike.
          version: '0.13.1'
          python-version: '3.12'

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --locked

      # tests/e2e against the image judged above (E2E_IMAGE_TAG: no second
      # build). --no-cov: the app runs in the container, not in this process.
      - name: E2E tests against the image
        env:
          E2E_IMAGE_TAG: ${{ env.CI_IMAGE }}
        run: uv run --no-sync pytest tests/e2e -v -m e2e --no-cov

  # ── cross-language compatibility (platform-interop-tests) ────────────────
  # Not a required check. It does gate release.yml's push (as in the Go repo).
  interop:
    name: Cross-language compatibility
    needs: [changes, validate-test]
    # Skipped where the run gets no secrets (a fork PR, or a Dependabot PR: GitHub withholds
    # Actions secrets from both), since interop.yml needs gh_private_token to check out the
    # private sibling repos. Not a required check; the push to main and release.yml run it.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.user.login != 'dependabot[bot]'))
    # Pinned to a commit (the repo has no tags) so the job definition that
    # receives GO_PRIVATE_TOKEN cannot change without a reviewed bump here.
    # interop.yml still checks out its own harness and the sibling repos at
    # main, by design. Bump together with release.yml (and with the other
    # libraries' pins).
    uses: BCBP-SOLUTIONS-FZC-LLC/platform-interop-tests/.github/workflows/interop.yml@9bd44ca774dcba7a0fddda63ddccd63752074a14 # main as of 2026-10-15 (platform-interop-tests#5: pgcommon 0.3 checks — pg-migrate, pg-metrics, GUCSet rules — and the live events checks)
    with:
      # This repo's own PR/branch ref; the other five default to their main branch (see
      # platform-interop-tests/README.md for why).
      platform_fastapicommon_ref: ${{ github.head_ref || github.ref_name }}
    secrets:
      # Requires a secret with read access across all six libraries. This org uses
      # GO_PRIVATE_TOKEN (already defined) for that; interop.yml's own input is
      # still named `gh_private_token` per its workflow_call contract.
      gh_private_token: ${{ secrets.GO_PRIVATE_TOKEN }}

  # ── posts or updates a single comment on every PR push ───────────────────
  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [changes, validate-test, validate-quality, build-image, trivy, smoke]
    # always(): report failures too, not only the all-green case. Runs on
    # docs-only PRs too, and says so.
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Post or update summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.code == 'false' }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)

  # ── push the example service image to GHCR on merge to main ─────────────
  # Publishes only the image trivy and smoke judged: same build args, and the
  # content fingerprint is compared before the push (a mismatch moves no tag)
  # and on the pushed digest before Cosign signs it (as in release.yml).
  push:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: [changes, validate-test, validate-quality, trivy, smoke]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs on main have one concurrency group per commit, so two can
      # overlap: only the run of the commit that is still the branch tip moves
      # the floating <branch> tag (an older run finishing last must not move
      # it back). Every run still pushes its own sha-<short> tag.
      - name: Is this commit the branch tip?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq .object.sha)
          if [ "$tip" = "$SHA" ]; then echo "tip=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::${SHA} is no longer the tip of ${BRANCH} (${tip}); pushing sha-${SHA::7} only"
            echo "tip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ steps.tip.outputs.tip == 'true' }}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pre-push gate: build what push will build (same cache sources), load
      # it, and require trivy's and smoke's fingerprint before any tag moves.
      - name: Build image locally (pre-push check)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.changes.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            SOURCE_DATE_EPOCH=${{ needs.changes.outputs.source_date_epoch }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache

      - name: Verify image matches the gated image (pre-push)
        env:
          TRIVY_FP: ${{ needs.trivy.outputs.fingerprint }}
          SMOKE_FP: ${{ needs.smoke.outputs.fingerprint }}
        run: bash .github/scripts/image-fingerprint.sh "${CI_IMAGE}" "${TRIVY_FP}" "${SMOKE_FP}"

      # type=image,push=true is `push: true` plus rewrite-timestamp (layer file times).
      - name: Build and push
        id: pushed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.changes.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
            SOURCE_DATE_EPOCH=${{ needs.changes.outputs.source_date_epoch }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Post-push gate: pull the pushed digest back and require the same
      # fingerprint. Runs before signing, so a mismatch is never signed.
      - name: Verify pushed image matches the gated image
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          TRIVY_FP: ${{ needs.trivy.outputs.fingerprint }}
          SMOKE_FP: ${{ needs.smoke.outputs.fingerprint }}
        run: |
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          bash .github/scripts/image-fingerprint.sh "${IMAGE_NAME}@${IMAGE_DIGEST}" "${TRIVY_FP}" "${SMOKE_FP}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via Sigstore OIDC — no long-lived key to rotate or leak.
      - name: Sign image with Cosign
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/ci\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh
