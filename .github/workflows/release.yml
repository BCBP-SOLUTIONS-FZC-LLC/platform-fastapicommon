# Release for https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-fastapicommon
# Triggered by version tags (e.g. v0.3.0 or v0.3.0-rc.1).
#
# Same pipeline as ci.yml — same job names, same gates, same order — run at
# the tagged commit, with a release front (tag + package version + CHANGELOG
# verification) and a release back (wheel/sdist, image push, PyPI, GitHub
# Release). Mirrors platform-gincommon's release.yml (via platform-eventcommon's
# Python port):
#
#   verify ──┬─► validate-test ────┬──► interop ──────────────┐
#            │                     ├──► dist ◄── quality ─────┤
#            ├─► build-image ──────┼──► trivy ────────────────┤──► push ──► pypi-publish ──► publish
#            │                     └──► smoke ────────────────┤
#            ├─► validate-quality ────────────────────────────┤
#            └─► api-compat ──────────────────────────────────┘
#
# (trivy and smoke need validate-test + build-image, exactly as in ci.yml;
# dist needs both validation gates; push needs everything. api-compat fails a
# release that may not break the public API — a PATCH, or any non-major
# release from 1.0.0 on — when griffe finds a breaking change.)
#
# interop gates push, as in the other libraries: a red cross-language check stops the
# whole release (no image, no PyPI upload, no GitHub Release).
#
# Third-party actions are pinned by commit SHA (`# vX.Y.Z`).
#
# Nothing is published until every gate has passed on the exact artifacts that
# ship. build-image, trivy, smoke and push all build the same Dockerfile at the
# same commit with the same build args (BUILD_VERSION = the tag,
# SOURCE_DATE_EPOCH = the commit time, also BuildKit's, with
# rewrite-timestamp), so push is normally a cache hit of the image that was
# scanned and smoke-tested. That is checked, not assumed: trivy and smoke each
# record a content fingerprint of the image they judged (image-fingerprint.sh:
# layer diff_ids + os/arch + runtime config; labels excluded because push adds
# metadata-action's OCI labels), and push compares it twice: on a local build
# before anything is pushed (a mismatch moves no tag), and on the pushed digest
# pulled back from GHCR before Cosign signs it (a mismatch leaves it unsigned
# and stops PyPI and the GitHub Release). The wheel and sdist are built ONCE
# (dist job); the very same files go to PyPI and to the GitHub Release, and
# SHA256SUMS is re-verified after every artifact hand-off.
#
# Order of the irreversible steps: push (image, re-taggable) → pypi-publish
# (a PyPI version can never be re-uploaded) → publish (GitHub Release). A
# failure in push therefore leaves PyPI untouched.
#
# Floating image tags only move forward: release-image-tags.sh (verify job)
# enables X.Y / X only when the tag is the highest stable version of that
# minor line / major line, so a hotfix of an older line gets only its own
# X.Y.Z (and X.Y if newest there). Pre-releases never move a floating tag.
# This image never gets `latest`: it is the example FastAPI service, a
# demonstration, not a deployable service (VERSIONING.md).
#
# workflow_dispatch: GitHub runs this file and the reusable validate-*.yml from
# the DISPATCHING ref, not from the tag, so verify refuses a dispatch unless
# github.ref is refs/heads/main or refs/tags/<the tag> (prefer the tag: then
# the pipeline is the tagged one). The tagged commit must also be reachable
# from origin/main (verify-release-tag.sh).
#
# Signing: the image is Cosign keyless-signed by digest (push); SHA256SUMS (the
# wheel's and sdist's checksums) is Cosign keyless-signed with sign-blob in
# publish, after every gate, and its Sigstore bundle ships as
# SHA256SUMS.sigstore.json (VERSIONING.md "Verifying a release" has the
# commands). PyPI additionally receives PEP 740 attestations from Trusted
# Publishing (gh-action-pypi-publish's default). The signer identity is
# release.yml@refs/tags/vX.Y.Z (or @refs/heads/main for a dispatch from main).
#
# Differences from ci.yml, all release-specific: the verify job; checkouts pin
# the tag; images are tagged X.Y.Z / X.Y / X (metadata-action's semver
# patterns, no `v`) instead of branch / sha; provenance is mode=max and
# exported; the Cosign identity must be release.yml at a tag (or main) ref;
# dist + pypi-publish + publish replace pr-summary.
name: Release

"on":
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: read
  packages: read

# Keyed by the TAG being released, not github.ref: a tag push (ref = the tag)
# and a workflow_dispatch for the same tag (ref = main or the tag, tag in the
# input) share one group, so two runs of one release never overlap.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/platform-fastapicommon
  CI_IMAGE: platform-fastapicommon-ci-test
  BUILDKIT_PROGRESS: plain

jobs:
  # ── fail fast: a wrong tag, version or a missing CHANGELOG section stops everything
  verify:
    name: Verify tag + version + CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_date_epoch: ${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
      tag_major: ${{ steps.tags.outputs.major }}
      tag_minor: ${{ steps.tags.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The uv the Dockerfile pins, so CI and the image resolve and build alike.
          version: '0.13.1'
          python-version: '3.12'

      # Dispatch ref (main or the tag), HEAD == tag, tag reachable from
      # origin/main (fetch-depth 0 above provides origin/main and every tag),
      # and pyproject.toml's version == the tag (release_guard.py).
      - name: Verify release tag (dispatch ref, checkout, on main, package version)
        run: bash .github/scripts/verify-release-tag.sh

      # Block the release if CHANGELOG.md has no entry for this tag (a
      # prerelease may use its base version's section).
      - name: Verify CHANGELOG entry exists
        run: bash .github/scripts/verify-changelog-entry.sh

      # One SOURCE_DATE_EPOCH for every image build and the wheel/sdist below,
      # so they are reproducible and push reuses the scanned image from cache.
      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      # Which floating tags (X.Y / X) this release may move.
      - name: Select floating image tags
        id: tags
        run: bash .github/scripts/release-image-tags.sh

  # ── same as ci.yml ────────────────────────────────────────────────────────
  validate-test:
    name: Validate / Test
    needs: verify
    uses: ./.github/workflows/validate-test.yml
    # Only the secret validate-test.yml declares (no `secrets: inherit`).
    secrets:
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # ── same as ci.yml ────────────────────────────────────────────────────────
  validate-quality:
    name: Validate / Quality
    needs: verify
    uses: ./.github/workflows/validate-quality.yml
    # Only the secret validate-quality.yml declares (no `secrets: inherit`).
    secrets:
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      require_gincommon_parity: true

  # ── release-only gate: no breaking public-API change unless the version may
  # break (griffe vs the highest stable tag below this one; ci.yml runs it as
  # a warning). 0.y.z: a MINOR bump may break, a PATCH may not (VERSIONING.md).
  api-compat:
    name: API compatibility
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The uv the Dockerfile pins, so CI and the image resolve and build alike.
          version: '0.13.1'
          python-version: '3.12'

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --locked

      - name: No breaking API change unless the version allows it
        run: make api-compat API_NEW_VERSION="${RELEASE_TAG}"

  # ── same as ci.yml: Hadolint first, then build into the cache ────────────
  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      # Cache targets (SOURCE_DATE_EPOCH comes from the verify job instead).
      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: 'true'
        run: bash .github/scripts/set-build-cache-targets.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retry once: booting buildx pulls moby/buildkit from Docker Hub, which
      # occasionally times out on shared runner IPs (see ci.yml).
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Always pull the base image for a release (digest-pinned, so this only
      # verifies the pinned digest is still resolvable).
      - name: Build image → cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          pull: true
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}

  # ── same as ci.yml ────────────────────────────────────────────────────────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [verify, validate-test, build-image]
    timeout-minutes: 15
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}

      # Content fingerprint of the image this job judges; push must match it.
      - name: Record image fingerprint
        id: fp
        run: bash .github/scripts/image-fingerprint.sh "${CI_IMAGE}"

      # Table format: human-readable in CI logs; fails on CRITICAL/HIGH/UNKNOWN.
      # Scans the OS layer and the installed Python packages (site-packages).
      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          scanners: vuln
          cache-dir: /tmp/trivy-cache

      # SARIF format: uploads to GitHub Security tab.
      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full component inventory for compliance / audit.
      # Attached to the GitHub Release by the publish job.
      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE }}
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ env.RELEASE_TAG }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── same as ci.yml ────────────────────────────────────────────────────────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [verify, validate-test, build-image]
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Restore from GHA cache (all layers cached → near-instant rebuild).
      - name: Load image from cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}

      # Content fingerprint of the image this job judges; push must match it.
      - name: Record image fingerprint
        id: fp
        run: bash .github/scripts/image-fingerprint.sh "${CI_IMAGE}"

      - name: Smoke tests
        env:
          IMAGE: ${{ env.CI_IMAGE }}
        run: bash .github/scripts/smoke-tests.sh

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The uv the Dockerfile pins, so CI and the image resolve and build alike.
          version: '0.13.1'
          python-version: '3.12'

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --locked

      # tests/e2e against the image judged above (see ci.yml).
      - name: E2E tests against the image
        env:
          E2E_IMAGE_TAG: ${{ env.CI_IMAGE }}
        run: uv run --no-sync pytest tests/e2e -v -m e2e --no-cov

  # ── same as ci.yml, against the tag ──────────────────────────────────────
  interop:
    name: Cross-language compatibility
    needs: validate-test
    # Pinned to a commit (the repo has no tags) so the job definition that
    # receives GO_PRIVATE_TOKEN cannot change under a release. The harness itself (run_interop.sh, sibling repos) is still
    # checked out at main by interop.yml, by design. Bump together with ci.yml.
    uses: BCBP-SOLUTIONS-FZC-LLC/platform-interop-tests/.github/workflows/interop.yml@9bd44ca774dcba7a0fddda63ddccd63752074a14 # main as of 2026-10-15 (platform-interop-tests#5: pgcommon 0.3 checks — pg-migrate, pg-metrics, GUCSet rules — and the live events checks)
    with:
      platform_fastapicommon_ref: ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      # The only secret interop.yml declares.
      gh_private_token: ${{ secrets.GO_PRIVATE_TOKEN }}

  # ── release-only: the wheel + sdist, built once for PyPI and the Release ──
  dist:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [verify, validate-test, validate-quality]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # The uv the Dockerfile pins, so CI and the image resolve and build alike.
          version: '0.13.1'
          python-version: '3.12'

      # Reproducible build (hash-locked backend, SOURCE_DATE_EPOCH), release
      # guard on the built metadata, twine check, installed-wheel check,
      # SHA256SUMS.
      - name: Prepare release distributions (wheel + sdist)
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
        run: bash .github/scripts/prepare-release-dist.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  # ── same as ci.yml's push, with release tags — only after every gate ──────
  push:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: [verify, validate-test, validate-quality, api-compat, trivy, smoke, interop, dist]
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.pushed.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write   # Cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # This image only ever contains the example service, not the library
          # — no automatic 'latest' tag, so nobody mistakes it for a deployable
          # production image (VERSIONING.md).
          flavor: |
            latest=false
          # X.Y.Z always; X.Y and X only when this tag is the highest stable
          # version of that line (verify: release-image-tags.sh), so a hotfix
          # of an older line never moves them backwards.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ needs.verify.outputs.tag_minor == 'true' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ needs.verify.outputs.tag_major == 'true' }}

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pre-push gate: build what push will build (same cache sources), load
      # it, and require trivy's and smoke's fingerprint before any tag moves.
      - name: Build image locally (pre-push check)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=docker,rewrite-timestamp=true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache

      - name: Verify image matches the gated image (pre-push)
        env:
          TRIVY_FP: ${{ needs.trivy.outputs.fingerprint }}
          SMOKE_FP: ${{ needs.smoke.outputs.fingerprint }}
        run: bash .github/scripts/image-fingerprint.sh "${CI_IMAGE}" "${TRIVY_FP}" "${SMOKE_FP}"

      # Same Dockerfile, commit and build args as build-image/trivy/smoke →
      # a cache hit of the image that was scanned and smoke-tested (checked
      # before and after this step).
      - name: Build and push
        id: pushed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source_date_epoch }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Post-push gate: pull the pushed digest back and require the same
      # fingerprint. Runs before signing, so a mismatch is never signed and
      # neither PyPI nor the GitHub Release is published.
      - name: Verify pushed image matches the gated image
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          TRIVY_FP: ${{ needs.trivy.outputs.fingerprint }}
          SMOKE_FP: ${{ needs.smoke.outputs.fingerprint }}
        run: |
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          bash .github/scripts/image-fingerprint.sh "${IMAGE_NAME}@${IMAGE_DIGEST}" "${TRIVY_FP}" "${SMOKE_FP}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via Sigstore OIDC — no long-lived key to rotate or leak.
      - name: Sign image with Cosign
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify image signature
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/release\.yml@refs/(tags/v.+|heads/main)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # Reads BuildKit's provenance attestation (stored in the image index) —
      # see the script for why this is not `cosign download attestation`.
      - name: Export SLSA provenance
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
        run: bash .github/scripts/export-image-provenance.sh

      - name: Upload provenance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-${{ env.RELEASE_TAG }}
          path: provenance.slsa.json
          retention-days: 90

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh

  # ── release-only: the wheel + sdist the dist job built, to PyPI ──────────
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [push]
    timeout-minutes: 10
    # Requires a "pypi" Trusted Publisher registered at
    # https://pypi.org/manage/account/publishing/ for this repo + this workflow
    # filename (see VERSIONING.md § Publishing to PyPI). No API token is
    # stored anywhere — PyPI trusts a short-lived OIDC token this job requests
    # via id-token: write.
    environment:
      name: pypi
      url: https://pypi.org/project/platform-fastapicommon/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: .

      # The files about to be uploaded are the ones the dist job checked.
      - name: Verify checksums
        run: bash .github/scripts/release-checksums.sh

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist/

  # ── release-only: the GitHub Release consuming services see ──────────────
  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [push, pypi-publish]
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write   # Cosign keyless sign-blob of SHA256SUMS
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Extract release notes from CHANGELOG
        env:
          IMAGE_VERSION: ${{ needs.push.outputs.version }}
          IMAGE_DIGEST: ${{ needs.push.outputs.digest }}
        run: bash .github/scripts/extract-release-notes.sh

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ env.RELEASE_TAG }}

      - name: Download provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance-${{ env.RELEASE_TAG }}

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ env.RELEASE_TAG }}
          path: .

      # Re-checks SHA256SUMS against the downloaded wheel and sdist (the files
      # PyPI received) before it is signed below.
      - name: Verify checksums
        run: bash .github/scripts/release-checksums.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed after every gate has passed; the bundle (certificate,
      # signature, Rekor entry) ships as a release asset.
      - name: Sign checksums with Cosign
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verify checksums signature
        env:
          REPO: ${{ github.repository }}
        run: |
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/release\.yml@refs/(tags/v.+|heads/main)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.push.outputs.digest }}
        run: bash .github/scripts/create-github-release.sh
